[project]
name = "bench-endpoint"
version = "0.1.0"
description = "Forge Tool endpoint for benchmark nodes (bench.describe / bench.run)"
requires-python = ">=3.12"
dependencies = [
    "dora-rs==0.4.1",
    "pyarrow>=23",
    "pydantic>=2",
    "pyyaml>=6",
    # forge-tool 不在我们能访问的 index 上。120 上通过 PYTHONPATH 指到
    # forge_gateway 仓库的 src/ 目录（见 README 的 L0 跑法）。
    # "forge-tool[dora]>=0.1.0,<0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench_endpoint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
