[project]
name = "forge-benchmark-libero"
version = "0.1.0"
description = "Standalone LIBERO benchmark node for Forge"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dora-rs==0.4.1",
    "forge-msgs",
    "numpy",
    "pyarrow",
    "pyyaml>=6.0",
    # LIBERO 与 robosuite 由评测环境提供（见 README 的环境要求），不在此声明，
    # 避免把一整套仿真依赖拖进基础节点环境。
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests", "_core/tests"]
pythonpath = ["."]

[tool.uv]
package = false

[tool.uv.sources]
forge-msgs = { git = "https://gitlab.ex-ai.cn/PhyAgentOS/framework/forge.git", subdirectory = "packages/msgs", rev = "83be2093b80310c438fa8f1d0d9a593123469d7d" }
