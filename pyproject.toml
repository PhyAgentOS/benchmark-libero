[project]
name = "forge-benchmark-libero"
version = "1.0.0"
description = "Standalone LIBERO benchmark node for Forge"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dora-rs==0.4.1",
    "forge-msgs==1.2.0",
    "forge-tool[dora]==1.0.0",
    "numpy",
    "pyarrow",
    "pyyaml>=6.0",
    # LIBERO 与 robosuite 由评测环境提供（见 README 的环境要求），不在此声明，
    # 避免把一整套仿真依赖拖进基础节点环境。
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests", "_core/tests", "bench_tool/tests"]
pythonpath = ["."]

[tool.uv]
package = false
